<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Manager</title>
    <link id="theme-style" rel="stylesheet" href="newdark.css" />
    <script src="webui.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Password Manager</h1>

      <div class="form-group theme-switch">
        <label for="themeToggle">Toggle Lightmode:</label>
        <label class="switch">
          <input type="checkbox" id="themeToggle" onchange="toggleTheme()" />
          <span class="slider"></span>
        </label>
      </div>

      <h2>Database Successfully Loaded.</h2>
      <button id="dbButton" onclick="toggleDatabase();">Open Database</button>

      <hr />

      <div id="addEntrySection" class="hidden">
        <h2>Add New Entry</h2>
        <div class="form-group">
          <input type="text" id="newTitle" placeholder="Title" />
          <input type="text" id="newUsername" placeholder="Username" />
          <input type="email" id="newEmail" placeholder="Email" />
          <div class="input-with-button">
            <input
              type="text"
              id="newPassword"
              placeholder="Password"
              oninput="checkPasswordStrength('')"
            />
            <button
              type="button"
              class="generate-btn"
              onclick="generatePassword()"
              title="Generate Password"
            >
              Generate
            </button>
          </div>
          <div
            id="passwordStrengthBar"
            style="
              height: 5px;
              width: 80%;
              background-color: #e0e0e0;
              margin-top: 5px;
              margin-bottom: 5px;
            "
          >
            <div
              id="strengthIndicator"
              style="height: 100%; width: 0%; background-color: red"
            ></div>
          </div>
          <input type="url" id="newURL" placeholder="URL" />
          <input type="text" id="newNotes" placeholder="Notes" />
          <button onclick="addEntry()">Add Entry</button>
        </div>
      </div>

      <hr />

      <div
        id="searchSection"
        class="form-group hidden"
        style="margin-top: 1rem"
      >
        <input
          type="text"
          id="searchInput"
          placeholder="Search by title..."
          oninput="filterEntries()"
        />
      </div>

      <div id="password-entries"></div>
    </div>
  </body>
</html>
